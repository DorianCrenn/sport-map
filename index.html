<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SportLink — Le sport près de toi</title>

    <!-- Favicon & app icons -->
    <link rel="icon" type="image/png" href="/Logo-sportlink-sans-fond.png" />
    <link rel="apple-touch-icon" href="/Logo-sportlink-sans-fond.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA / mobile meta -->
    <meta name="theme-color" content="#0F1E3A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SportLink" />
    <meta name="application-name" content="SportLink" />

    <!-- SEO basics -->
    <meta name="description" content="Trouve des clubs, des matchs et des événements sportifs autour de toi en Finistère." />
    <meta name="keywords" content="sport, Finistère, Brest, clubs sportifs, matchs, trail, football, handball" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="SportLink" />
    <meta property="og:title"       content="SportLink — Le sport près de toi" />
    <meta property="og:description" content="Trouve des clubs, des matchs et des événements sportifs autour de toi en Finistère." />
    <meta property="og:image"       content="%VITE_APP_URL%/Logo-sportlink-sans-fond.png" />
    <meta property="og:url"         content="%VITE_APP_URL%" />
    <meta property="og:locale"      content="fr_FR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="SportLink — Le sport près de toi" />
    <meta name="twitter:description" content="Trouve des clubs, des matchs et des événements sportifs autour de toi en Finistère." />
    <meta name="twitter:image"       content="%VITE_APP_URL%/Logo-sportlink-sans-fond.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
