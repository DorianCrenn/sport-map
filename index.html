<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SportLink — Le sport près de toi</title>

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1FD37E">

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA / mobile meta -->
    <meta name="theme-color" content="#0B1E3D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SportLink" />
    <meta name="application-name" content="SportLink" />

    <!-- SEO basics -->
    <meta name="description" content="Trouve des clubs, des matchs et des événements sportifs autour de toi partout en France." />
    <meta name="keywords" content="sport, France, clubs sportifs, matchs, trail, football, handball" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="SportLink" />
    <meta property="og:title"       content="SportLink — Le sport près de toi" />
    <meta property="og:description" content="Trouve des clubs, des matchs et des événements sportifs autour de toi partout en France." />
    <meta property="og:image"       content="%VITE_APP_URL%/og-preview.png" />
    <meta property="og:url"         content="%VITE_APP_URL%" />
    <meta property="og:locale"      content="fr_FR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="SportLink — Le sport près de toi" />
    <meta name="twitter:description" content="Trouve des clubs, des matchs et des événements sportifs autour de toi partout en France." />
    <meta name="twitter:image"       content="%VITE_APP_URL%/og-preview.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Anton&family=Inter:wght@300;400;500;600&family=Bebas+Neue&family=Montserrat:wght@400;700;900&family=Roboto+Condensed:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Barlow+Condensed:wght@400;700;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Service Worker registration -->
    <script src="/register-sw.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
