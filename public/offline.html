<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SportLink — Hors ligne</title>
  <meta name="theme-color" content="#0F1E3A" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0F1E3A;
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #fff; }
    p  { font-size: 14px; color: #94a3b8; line-height: 1.6; max-width: 280px; }
    .btn {
      margin-top: 28px;
      padding: 12px 28px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #22D96A;
      color: #0F1E3A;
    }
  </style>
</head>
<body>
  <div class="logo">📶</div>
  <h1>Vous êtes hors ligne</h1>
  <p>Vérifiez votre connexion Internet pour accéder aux événements et clubs SportLink.</p>
  <button class="btn" onclick="location.reload()">Réessayer</button>
</body>
</html>
