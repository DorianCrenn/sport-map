name: CI — Tests & Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Bloque le déploiement Vercel si les tests échouent
# (Vercel vérifie le statut des checks GitHub avant de déployer)

jobs:
  test:
    name: Lint + Tests unitaires
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sport-map

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sport-map/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests unitaires
        run: npm run test
        env:
          # Variables factices — les tests mockent Supabase, pas besoin de vraies clés
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key

      - name: Couverture de code
        if: github.ref == 'refs/heads/main'
        run: npm run test:coverage
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key

      - name: Upload coverage report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: sport-map/coverage/
          retention-days: 14

  build:
    name: Build de production
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: sport-map

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sport-map/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build Vite
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    # Tourne sur main et sur les PRs vers main seulement (évite les runs trop fréquents)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: sport-map

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sport-map/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Playwright + navigateurs
        run: npx playwright install --with-deps chromium

      - name: Build Vite (pour preview)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key

      - name: Smoke anti-crash (E2E) — fail-fast
        run: npm run test:e2e:smoke
        env:
          CI: true
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key

      - name: Tests E2E Playwright
        run: npx playwright test --project="Desktop Chrome 1440" --reporter=list e2e/pages/ e2e/roles/
        env:
          CI: true
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key
          # Sur Vercel Preview, surcharger baseURL avec l'URL de la preview
          # PLAYWRIGHT_BASE_URL: ${{ vars.VERCEL_PREVIEW_URL }}

      - name: Upload rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sport-map/e2e/reports/
          retention-days: 14
